ption><table><thead><tr><th>Checklist Item</th><th>Action Required</th><th>Tool / Method</th><th>Target Standard</th></tr></thead><tbody><tr><td>1. File Naming</td><td>Rename camera files with keywords &amp; city</td><td>Manual / Bulk Rename</td><td>service-city-brand.jpg</td></tr><tr><td>2. GPS EXIF Data</td><td>Embed latitude and longitude</td><td>IMGSEO Free Geo Tagger</td><td>Verified address coordinates</td></tr><tr><td>3. Format Selection</td><td>Convert to next-gen WebP</td><td>IMGSEO WebP Converter</td><td>WebP (or JPEG for GBP)</td></tr><tr><td>4. Dimension Sizing</td><td>Scale to max display container size</td><td>Canvas Resize</td><td>Max 1920px (Desktop) / 1200px (Mobile)</td></tr><tr><td>5. Byte Compression</td><td>Reduce file weight by 60–80%</td><td>IMGSEO Image Compressor</td><td>Under 150KB (Hero) / 70KB (Body)</td></tr><tr><td>6. ALT Text</td><td>Write descriptive accessibility text</td><td>HTML alt attribute</td><td>50–125 characters, natural syntax</td></tr><tr><td>7. Explicit Dimensions</td><td>Declare width and height attributes</td><td>HTML / CSS attributes</td><td>Prevents CLS layout shifts</td></tr><tr><td>8. Lazy Loading</td><td>Defer offscreen image loading</td><td>loading=&quot;lazy&quot;</td><td>Instant initial viewport render</td></tr><tr><td>9. Image Sitemap</td><td>Include images in XML sitemap</td><td>Sitemap Generator</td><td>Crawlable image URLs</td></tr><tr><td>10. Schema.org</td><td>Add WebApplication / ImageObject</td><td>JSON-LD structured data</td><td>Rich SERP display</td></tr></tbody></table></div></section><section><h2>The 5-Minute Step-by-Step Workflow</h2><ul><li>Step 1 — Name the File: Replace 'IMG_9102.jpg' with 'commercial-roofing-repair-austin-tx.jpg'.</li><li>Step 2 — Geo Tag Location: Use our &lt;a href='/free-geo-tagger' class='text-primary font-bold hover:underline'&gt;Geo Tagger&lt;/a&gt; to inject exact coordinates if the photo is destined for a local landing page or GBP.</li><li>Step 3 — Compress &amp; Convert: Run the image through our &lt;a href='/free-webp-converter' class='text-primary font-bold hover:underline'&gt;WebP Converter&lt;/a&gt; or &lt;a href='/free-online-image-compressor' class='text-primary font-bold hover:underline'&gt;Image Compressor&lt;/a&gt; to slash weight under 100KB.</li><li>Step 4 — Add Contextual ALT Text: Write a natural description for accessibility and screen readers.</li><li>Step 5 — Publish &amp; Verify: Upload the asset to your CMS and confirm responsive scaling across mobile devices.</li></ul></section><section><h2>Recommended Next Steps &amp; Related Deep Dives</h2><p>To master each step of this framework, explore our guides on <a href='/blog/image-file-names-local-seo' class='text-primary font-bold hover:underline'>image file naming rules</a>, <a href='/blog/alt-text-local-seo-formula' class='text-primary font-bold hover:underline'>ALT text formulas</a>, and <a href='/blog/google-business-profile-photo-optimization' class='text-primary font-bold hover:underline'>GBP photo optimization</a>.</p></section><section class="faqs"><h2>Frequently Asked Questions</h2><dl><dt><strong>How long does this image SEO workflow take per photo?</strong></dt><dd>With IMGSEO's free browser tools and batch processing, optimizing a batch of 10 photos takes less than 2 minutes.</dd><dt><strong>What is the single most important step in the checklist?</strong></dt><dd>File compression and WebP conversion have the biggest direct impact on site speed and Core Web Vitals, while filenames and geotags drive keyword relevance.</dd><dt><strong>Can I automate this checklist in WordPress?</strong></dt><dd>Plugins can automate compression and WebP conversion, but filename optimization, contextual alt text, and custom GPS tagging are best done prior to upload.</dd><dt><strong>How does lazy loading improve image performance?</strong></dt><dd>The loading=&quot;lazy&quot; attribute tells the browser not to download images until the user scrolls near them, speeding up initial page render times significantly.</dd><dt><strong>Does image SEO work for service-area businesses without a storefront?</strong></dt><dd>Yes! Service area businesses (locksmiths, electricians, plumbers) benefit greatly by tagging job photos with the specific cities and neighborhoods they service.</dd></dl></section></article>
