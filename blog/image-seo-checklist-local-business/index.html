<td>Verified address coordinates</td></tr><tr><td>3. Format Selection</td><td>Convert to next-gen WebP</td><td>IMGSEO WebP Converter</td><td>WebP (or JPEG for GBP)</td></tr><tr><td>4. Dimension Sizing</td><td>Scale to max display container size</td><td>Canvas Resize</td><td>Max 1920px (Desktop) / 1200px (Mobile)</td></tr><tr><td>5. Byte Compression</td><td>Reduce file weight by 60–80%</td><td>IMGSEO Image Compressor</td><td>Under 150KB (Hero) / 70KB (Body)</td></tr><tr><td>6. ALT Text</td><td>Write descriptive accessibility text</td><td>HTML alt attribute</td><td>50–125 characters, natural syntax</td></tr><tr><td>7. Explicit Dimensions</td><td>Declare width and height attributes</td><td>HTML / CSS attributes</td><td>Prevents CLS layout shifts</td></tr><tr><td>8. Lazy Loading</td><td>Defer offscreen image loading</td><td>loading=&quot;lazy&quot;</td><td>Instant initial viewport render</td></tr><tr><td>9. Image Sitemap</td><td>Include images in XML sitemap</td><td>Sitemap Generator</td><td>Crawlable image URLs</td></tr><tr><td>10. Schema.org</td><td>Add WebApplication / ImageObject</td><td>JSON-LD structured data</td><td>Rich SERP display</td></tr></tbody></table></div></section><section><h2>The 5-Minute Step-by-Step Workflow</h2><ul><li>Step 1 — Name the File: Replace 'IMG_9102.jpg' with 'commercial-roofing-repair-austin-tx.jpg'.</li><li>Step 2 — Geo Tag Location: Use our &lt;a href='/free-geo-tagger' class='text-primary font-bold hover:underline'&gt;Geo Tagger&lt;/a&gt; to inject exact coordinates if the photo is destined for a local landing page or GBP.</li><li>Step 3 — Compress &amp; Convert: Run the image through our &lt;a href='/free-webp-converter' class='text-primary font-bold hover:underline'&gt;WebP Converter&lt;/a&gt; or &lt;a href='/free-online-image-compressor' class='text-primary font-bold hover:underline'&gt;Image Compressor&lt;/a&gt; to slash weight under 100KB.</li><li>Step 4 — Add Contextual ALT Text: Write a natural description for accessibility and
